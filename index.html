<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perasmian WPD 2026</title>
  <style>
    /* Reset margins so everything fits perfectly */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      overflow: hidden;
    }

    /* Fullscreen Start Overlay */
    #startOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 24px;
      z-index: 10000; /* Stays on top of everything */
      cursor: pointer;
    }

    /* Iframe styling */
    .jigsaw-frame {
      width: 100%;
      height: calc(100% - 20px); /* Leave 20px for the focus bar */
      border: none;
    }

    /* Focus Area: Click this after finishing the puzzle so the keyboard shortcut works */
    .focus-area {
      height: 20px;
      width: 100%;
      background-color: #111;
      color: #555;
      text-align: center;
      font-family: sans-serif;
      font-size: 12px;
      line-height: 20px;
      cursor: pointer;
    }
    
    .focus-area:active {
      background-color: #333;
    }

    /* Video hidden by default */
    #montageVideo {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background-color: black;
    }
  </style>
</head>
<body>

  <!-- Start Overlay -->
  <div id="startOverlay">
    [ Click anywhere to Start Perasmian WPD 2026 Gimmick ]
  </div>

  <!-- Jigsaw Puzzle -->
  <iframe 
    class="jigsaw-frame"
    src="https://www.jigsawplanet.com/?rc=play&amp;pid=032c5c9d7fc4&amp;view=iframe" 
    allowfullscreen>
  </iframe>

  <!-- Focus Zone -->
  <div class="focus-area" onclick="this.focus()" tabindex="-1" title="Click here to re-focus the window for the keyboard shortcut">
    [ Click here after puzzle is done to enable keyboard shortcut ]
  </div>

  <!-- Montage Video -->
  <video id="montageVideo" controls>
    <source src="https://hsegamat2.moh.gov.my/qms/static/media/video-wpd.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <script>
    // --- FULLSCREEN START LOGIC ---
    const startOverlay = document.getElementById('startOverlay');
    
    startOverlay.addEventListener('click', function() {
      // 1. Request fullscreen for the whole webpage (not just the video)
      const docElm = document.documentElement;
      if (docElm.requestFullscreen) {
        docElm.requestFullscreen();
      } else if (docElm.webkitRequestFullscreen) { /* Safari */
        docElm.webkitRequestFullscreen();
      } else if (docElm.msRequestFullscreen) { /* IE11 */
        docElm.msRequestFullscreen();
      }
      
      // 2. Hide this overlay so the VIP can see the puzzle
      startOverlay.style.display = 'none';
    });


    // --- VIDEO SHORTCUT LOGIC ---
    const video = document.getElementById('montageVideo');

    // Listen for the Keyboard Shortcut ('v' or 'V')
    window.addEventListener('keydown', function(event) {
      if (event.key === 'v' || event.key === 'V') {
        event.preventDefault(); // Block any browser default action
        playMontage();
      }
    });

    function playMontage() {
      video.style.display = 'block';

      // Push the video itself to fullscreen
      if (video.requestFullscreen) {
        video.requestFullscreen();
      } else if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();
      } else if (video.msRequestFullscreen) {
        video.msRequestFullscreen();
      }

      video.play();
    }

    video.addEventListener('ended', function() {
      // Note: Exiting fullscreen here will exit the WHOLE page's fullscreen.
      // If you just want the video to disappear and keep the puzzle fullscreen, 
      // remove the if(document.fullscreenElement) block.
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
      video.style.display = 'none';
    });
  </script>

</body>
</html>
